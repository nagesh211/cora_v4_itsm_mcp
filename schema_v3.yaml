modules:
- name: itsm
  database_type: postgres
  code: INONE
  is_date_applicable: true
  description: this dataset contains information about incident,change,problem,Service requests, assets (CMDB); also it has calculations related various ITSM metrics.
  relationships:
  - name: incident_caused_by_change
    description: Incidents linked to the change that caused them.
    left: itsm_incident.tbl_all_incidents
    right: itsm_change.tbl_change
    via: itsm.tbl_incident_change_relation
    left_on:
      left_col: incident_system_id
      via_col: incident_system_id
    right_on:
      right_col: change_system_id
      via_col: change_system_id
    const:
      col: type
      value: Caused By Change
  - name: incident_has_problem
    description: Incidents linked to a related problem record.
    left: itsm_incident.tbl_all_incidents
    right: itsm_problem.tbl_problem
    via: itsm.tbl_incident_problem_relation
    left_on:
      left_col: incident_system_id
      via_col: incident_system_id
    right_on:
      right_col: problem_system_id
      via_col: problem_system_id
  - name: release_causes_change
    description: Releases joined to their changes by change_id.
    left: itsm_release.tbl_pepops_release_mgmt
    right: itsm_change.tbl_change
    join_on:
      left_col: change_id
      right_col: change_id
  - name: incident_sla_resolution
    description: Incidents joined to their SLA resolution rows.
    left: itsm_incident.tbl_all_incidents
    right: itsm_incident.tbl_sla_resolution
    join_on:
      left_col: incident_system_id
      right_col: incident_system_id
  entities:
  - name: incident
    tables:
    - name: itsm_incident.tbl_all_incidents
      description: Incident data for ITSM, including details of whether the incident is active or not, major incident or not, and details when it is created, opened, resolved, closed etc., and other related information related to where it is created like business name, region, service area, hierarchies and location details etc.
      time:
        field: created_date
        type: date
        grain: day
      columns:
      - name: active_indicator_type
        type: varchar
        role: dimension
        canonical: is active
        alias: is active
        possible_values: ['NO', 'YES']
      - name: assignment_group_name
        type: varchar
        role: dimension
        canonical: assignment group
        alias: assignment group
        deeper_insights: true
      - name: business_name
        type: text []
        role: dimension
        canonical: sector
        alias: sector
        cross_join: cross join LATERAL unnest(business_name) AS s(sector)
      - name: category_description
        type: varchar
        role: dimension
        canonical: category
        alias: category
        deeper_insights: true
      - name: city
        type: varchar
        role: dimension
      - name: closed_date
        type: date
        role: timestamp
        description: This is a default date column for all count related questions other than incident created.
      - name: configuration_item_name
        type: varchar
        role: dimension
        canonical: configuration item
        alias: configuration item
        deeper_insights: true
      - name: contact_type
        type: varchar
        role: dimension
      - name: country
        type: varchar
        role: dimension
      - name: created_date
        type: date
        role: timestamp
      - name: description_text
        type: varchar
        role: dimension
        canonical: description
        alias: description
      - name: exception_status
        type: varchar
        role: dimension
        canonical: exception status
        alias: exception status
        possible_values: [Approved]
      - name: full_name
        type: varchar
        role: dimension
        canonical: reported by
        alias: reported by
      - name: gpid
        type: varchar
        role: dimension
        canonical: user id, requestor
        alias: user id, requestor
      - name: hierarchy_1
        type: varchar
        role: dimension
      - name: hierarchy_2
        type: varchar
        role: dimension
      - name: hierarchy_3
        type: varchar
        role: dimension
      - name: hierarchy_4
        type: varchar
        role: dimension
      - name: hierarchy_5
        type: varchar
        role: dimension
      - name: incident_id
        type: varchar
        role: identifier
      - name: incident_system_id
        type: varchar
        role: identifier
        primary_key: true
      - name: it_vendor_name
        type: varchar
        role: dimension
        canonical: vendor
        alias: vendor
        deeper_insights: true
      - name: location_name
        type: varchar
        role: dimension
      - name: major_incident_indicator
        type: boolean
        role: dimension
        canonical: major incident
        alias: major incident
        description: flags an incident as major. Restored to the schema after it was
          found missing while the database still had it - predicates.json binds the
          'major_incident' predicate to this column, and without the declaration that
          binding was dead and every major-incident question had to fall back to
          tbl_major_incidents.
      - name: open_date
        type: date
        role: timestamp
        description: use this column only for the queries that needs open date. E.g. incidents opened in last 7 days.
      - name: priority_code
        type: varchar
        role: dimension
        canonical: priority
        alias: priority
        deeper_insights: true
        possible_values: [P1, P2, P3, P4, P5]
      - name: region_name
        type: text []
        role: dimension
        canonical: region
        alias: region
        cross_join: cross join LATERAL unnest(region_name) AS s(region)
      - name: reassignment_count
        type: int8
        role: dimension
        canonical: reassignment count
        alias: reassignment count
      - name: reopen_count
        type: numeric
        role: measure
      - name: reopen_date
        type: date
        role: timestamp
      - name: resolved_date
        type: date
        role: timestamp
      - name: resolved_date_time
        type: timestamp
        role: timestamp
      - name: service_area
        type: varchar
        role: dimension
        canonical: capability
        alias: capability
        deeper_insights: true
      - name: service_offering_configuration_item_name
        type: varchar
        role: dimension
        canonical: service offering configuration item
        alias: service offering configuration item
      - name: status_name
        type: varchar
        role: dimension
        canonical: status
        alias: status
        deeper_insights: true
        possible_values: [ASSIGNED, CANCELED, CLOSED, IN PROGRESS, IN QUEUE, NEW, PENDING, RESOLVED, NOT APPLICABLE, NOT FOUND, NOT PROVIDED]
      - name: sub_business_name
        type: text []
        role: dimension
        canonical: division
        alias: division
        cross_join: cross join LATERAL unnest(sub_business_name) AS s(division)
    - name: itsm_incident.tbl_incident_sla
      description: Incident SLA data of incidents for ITSM, table represents Service Level Agreement (SLA) tracking data for ITSM (IT Service Management) incidents. It contains detailed information about each incidents SLA lifecycle, including assignment, location, priority, responsible groups, SLA breach status, durations, and resolution timestamps. This table is used to analyze SLA compliance, incident resolution performance, and operational metrics related to incident management.
      time:
