modules:
  - name: itsm
    database_type: postgres
    code: INONE
    is_date_applicable: true
    description: this dataset contains information about incident,change,problem,Service requests, assets (CMDB); also it has calculations related various ITSM metrics.
    entities:
      - name: incident
        tables:
          - name: itsm_incident.tbl_all_incidents
            description: Incident data for ITSM, including details of whether the incident is active or not, major incident or not, and details when it is created, opened, resolved, closed etc., and other related information related to where it is created like business name, region, service area, hierarchies and location details etc.
            columns:
              - name: active_indicator_type
                type: varchar
                alias: is active
                possible_values: ['NO', 'YES']
              - name: assignment_group_name
                type: varchar
                alias: assignment group
                deeper_insights: true
              - name: business_name
                type: text []
                alias: sector
                cross_join: cross join LATERAL unnest(business_name) AS s(sector)
              - name: category_description
                type: varchar
                alias: category
                deeper_insights: true
              - name: city
                type: varchar
              - name: closed_date
                type: date
                description: This is a default date column for all count related questions other than incident created.
              - name: configuration_item_name
                type: varchar
                alias: configuration item
                deeper_insights: true
              - name: contact_type
                type: varchar
              - name: country
                type: varchar
              - name: created_date
                type: date
              - name: description_text
                type: varchar
                alias: description
              - name: exception_status
                type: varchar
                alias: exception status
                possible_values: [Approved]
              - name: full_name
                type: varchar
                alias: reported by
              - name: gpid
                type: varchar
                alias: user id, requestor
              - name: hierarchy_1
                type: varchar
              - name: hierarchy_2
                type: varchar
              - name: hierarchy_3
                type: varchar
              - name: hierarchy_4
                type: varchar
              - name: hierarchy_5
                type: varchar
              - name: incident_id
                type: varchar
              - name: incident_system_id
                type: varchar
                primary_key: true
              - name: it_vendor_name
                type: varchar
                alias: vendor
                deeper_insights: true
              - name: location_name
                type: varchar
              - name: open_date
                type: date
                description: use this column only for the queries that needs open date. E.g. incidents opened in last 7 days.
              - name: priority_code
                type: varchar
                alias: priority
                deeper_insights: true
                possible_values: [P1, P2, P3, P4, P5]
              - name: region_name
                type: text []
                alias: region
                cross_join: cross join LATERAL unnest(region_name) AS s(region)
              - name: reassignment_count
                type: int8
                alias: reassignment count
              - name: reopen_count
                type: numeric
              - name: reopen_date
                type: date
              - name: resolved_date
                type: date
              - name: resolved_date_time
                type: timestamp
              - name: service_area
                type: varchar
                alias: capability
                deeper_insights: true
              - name: service_offering_configuration_item_name
                type: varchar
                alias: service offering configuration item
              - name: status_name
                type: varchar
                alias: status
                possible_values: [ASSIGNED, CANCELED, CLOSED, IN PROGRESS, IN QUEUE, NEW, PENDING, RESOLVED, NOT APPLICABLE, NOT FOUND, NOT PROVIDED]
                deeper_insights: true
              - name: sub_business_name
                type: text []
                alias: division
                cross_join: cross join LATERAL unnest(sub_business_name) AS s(division)
          - name: itsm_incident.tbl_incident_sla
            description: Incident SLA data of incidents for ITSM, table represents Service Level Agreement (SLA) tracking data for ITSM (IT Service Management) incidents. It contains detailed information about each incidents SLA lifecycle, including assignment, location, priority, responsible groups, SLA breach status, durations, and resolution timestamps. This table is used to analyze SLA compliance, incident resolution performance, and operational metrics related to incident management.
            columns:
              - name: assignment_group_name
                type: varchar
                alias: assignment group
              - name: business_name
                type: text []
                alias: sector
                cross_join: cross join LATERAL unnest(business_name) AS s(sector)
              - name: city
                type: varchar
              - name: closed_date
                type: date
              - name: contact_type
                type: varchar
              - name: country
                type: varchar
              - name: created_date
                type: date
              - name: description_text
                type: text
                alias: description
              - name: exception_status
                type: varchar
                possible_values: [Approved]
              - name: full_name
                type: varchar
                alias: reported by
              - name: hierarchy_1
                type: varchar
              - name: hierarchy_2
                type: varchar
              - name: hierarchy_3
                type: varchar
              - name: hierarchy_4
                type: varchar
              - name: hierarchy_5
                type: varchar
              - name: incident_id
                type: varchar
              - name: incident_sla_system_id
                type: varchar
                primary_key: true
              - name: incident_system_id
                type: varchar
                inner_join: itsm_incident.tbl_incident_sla.incident_system_id = itsm.tbl_incident_company.incident_system_id
              - name: it_vendor_name
                type: varchar
                alias: vendor
              - name: latitude
                type: numeric
              - name: location_name
                type: text
              - name: longitude
                type: numeric
              - name: open_date
                type: date
              - name: priority_code
                type: varchar
                alias: priority
                possible_values: [P1, P2, P3, P4, P5]
              - name: reassignment_count
                type: int4
                alias: reassignment count
              - name: region_name
                type: text []
                alias: region
                cross_join: cross join LATERAL unnest(region_name) AS s(region)
              - name: resolved_date
                type: date
              - name: responsible_group_hierarchy_1
                type: varchar
              - name: responsible_group_hierarchy_2
                type: varchar
              - name: responsible_group_hierarchy_3
                type: varchar
              - name: responsible_group_hierarchy_4
                type: varchar
              - name: responsible_group_hierarchy_5
                type: varchar
              - name: responsible_group_service_area
                type: varchar
              - name: responsible_group_vendor_name
                type: varchar
                possible_values: [NOT FOUND]
              - name: sla_breached_indicator_type
                type: varchar
              - name: sla_breached_indicator
                type: varchar
                alias: sla breached
                possible_values: ['0', '1', 'NO', 'YES']
              - name: sla_duration_hours
                type: numeric
              - name: sla_duration_minutes
                type: numeric
              - name: sla_duration_seconds
                type: numeric
              - name: sla_end_date
                type: date
              - name: sla_name
                type: varchar
              - name: sla_stage
                type: varchar
                alias: sla stage
                possible_values: [CANCELLED, COMPLETED, IN PROGRESS, PAUSED]
              - name: sla_start_date
                type: date
              - name: sla_start_date_time
                type: timestamp
              - name: sla_target
                type: varchar
                possible_values: [resolution, response]
              - name: sla_type_value
                type: varchar
                possible_values: [SLA]
              - name: state
                type: varchar
              - name: status_name
                type: varchar
                alias: sla status
                possible_values: [PENDING, RESOLVED]
              - name: sub_business_name
                type: text []
                alias: division
                cross_join: cross join LATERAL unnest(sub_business_name) AS s(division)
              - name: title_text
                type: text
              - name: zip
                type: varchar
          - name: itsm.tbl_incident_company
            description: Incident company mapping table providing business (sector) context and organizational relationships for incidents to support sector-based reporting and analysis.
            columns:
              - name: incident_system_id
                type: varchar
              - name: business_name
                type: varchar
                deeper_insights: true
              - name: sub_business_name
                type: varchar
              - name: region_name
                type: varchar
                deeper_insights: true
              - name: combined_business_name
                type: varchar
              - name: type
                type: varchar
                possible_values: [Company]
              - name: region_active_indicator
